<svg viewBox="0 0 1400 1300" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', system-ui, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#080818"/><stop offset="100%" style="stop-color:#0f0f2e"/>
    </linearGradient>
    <marker id="arr" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#818cf8"/>
    </marker>
    <marker id="arrGreen" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#34d399"/>
    </marker>
    <marker id="arrOrange" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#fbbf24"/>
    </marker>
    <marker id="arrCyan" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#22d3ee"/>
    </marker>
    <marker id="arrRed" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#f87171"/>
    </marker>
    <filter id="shadow">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <rect width="1400" height="1300" fill="url(#bg)"/>

  <!-- Title -->
  <text x="700" y="40" text-anchor="middle" fill="#e2e8f0" font-size="26" font-weight="bold">Complete API Sequence Diagram</text>
  <text x="700" y="65" text-anchor="middle" fill="#94a3b8" font-size="13">Every HTTP request, Trigger.dev task call, AI API call, and stream event in order</text>

  <!-- SWIMLANE HEADERS -->
  <rect x="80" y="85" width="130" height="40" rx="8" fill="#1e1b4b" stroke="#6366f1" stroke-width="2"/>
  <text x="145" y="110" text-anchor="middle" fill="#c4b5fd" font-size="12" font-weight="bold">Browser</text>

  <rect x="290" y="85" width="130" height="40" rx="8" fill="#0d1117" stroke="#f97316" stroke-width="2"/>
  <text x="355" y="110" text-anchor="middle" fill="#fb923c" font-size="12" font-weight="bold">Next.js API</text>

  <rect x="530" y="85" width="130" height="40" rx="8" fill="#1a0033" stroke="#7c3aed" stroke-width="2"/>
  <text x="595" y="110" text-anchor="middle" fill="#a78bfa" font-size="12" font-weight="bold">Trigger.dev</text>

  <rect x="770" y="85" width="130" height="40" rx="8" fill="#1a0033" stroke="#8b5cf6" stroke-width="2"/>
  <text x="835" y="110" text-anchor="middle" fill="#c4b5fd" font-size="12" font-weight="bold">Sub-Tasks</text>

  <rect x="1010" y="85" width="130" height="40" rx="8" fill="#0d2137" stroke="#3b82f6" stroke-width="2"/>
  <text x="1075" y="110" text-anchor="middle" fill="#93c5fd" font-size="12" font-weight="bold">Gemini AI</text>

  <rect x="1230" y="85" width="130" height="40" rx="8" fill="#022c22" stroke="#10b981" stroke-width="2"/>
  <text x="1295" y="110" text-anchor="middle" fill="#6ee7b7" font-size="12" font-weight="bold">Terraform CLI</text>

  <!-- Lifelines -->
  <line x1="145" y1="130" x2="145" y2="1280" stroke="#333" stroke-width="1" stroke-dasharray="4,4"/>
  <line x1="355" y1="130" x2="355" y2="1280" stroke="#333" stroke-width="1" stroke-dasharray="4,4"/>
  <line x1="595" y1="130" x2="595" y2="1280" stroke="#333" stroke-width="1" stroke-dasharray="4,4"/>
  <line x1="835" y1="130" x2="835" y2="1280" stroke="#333" stroke-width="1" stroke-dasharray="4,4"/>
  <line x1="1075" y1="130" x2="1075" y2="1280" stroke="#333" stroke-width="1" stroke-dasharray="4,4"/>
  <line x1="1295" y1="130" x2="1295" y2="1280" stroke="#333" stroke-width="1" stroke-dasharray="4,4"/>

  <!-- STEP LABELS (left side) -->
  <rect x="10" y="145" width="55" height="20" rx="4" fill="#312e81"/>
  <text x="37" y="160" text-anchor="middle" fill="#fff" font-size="9" font-weight="bold">INIT</text>

  <rect x="10" y="285" width="55" height="20" rx="4" fill="#6366f1"/>
  <text x="37" y="300" text-anchor="middle" fill="#fff" font-size="9" font-weight="bold">STEP 1</text>

  <rect x="10" y="440" width="55" height="20" rx="4" fill="#2563eb"/>
  <text x="37" y="455" text-anchor="middle" fill="#fff" font-size="9" font-weight="bold">STEP 2</text>

  <rect x="10" y="620" width="55" height="20" rx="4" fill="#16a34a"/>
  <text x="37" y="635" text-anchor="middle" fill="#fff" font-size="9" font-weight="bold">STEP 3</text>

  <rect x="10" y="830" width="55" height="20" rx="4" fill="#d97706"/>
  <text x="37" y="845" text-anchor="middle" fill="#fff" font-size="9" font-weight="bold">STEP 4</text>

  <rect x="10" y="1060" width="55" height="20" rx="4" fill="#059669"/>
  <text x="37" y="1075" text-anchor="middle" fill="#fff" font-size="9" font-weight="bold">STEP 5</text>

  <!-- INITIALIZATION -->
  <!-- 1. User submits form -->
  <line x1="150" y1="155" x2="348" y2="155" stroke="#818cf8" stroke-width="2" marker-end="url(#arr)"/>
  <text x="250" y="148" text-anchor="middle" fill="#c4b5fd" font-size="10" font-weight="600">POST /api/agent</text>
  <text x="250" y="168" text-anchor="middle" fill="#94a3b8" font-size="9">{ prompt: "Deploy EC2..." }</text>

  <!-- 2. API triggers orchestrator -->
  <line x1="360" y1="190" x2="588" y2="190" stroke="#a78bfa" stroke-width="2" marker-end="url(#arr)"/>
  <text x="475" y="183" text-anchor="middle" fill="#a78bfa" font-size="10" font-weight="600">infraAgentOrchestrator.trigger()</text>
  <text x="475" y="203" text-anchor="middle" fill="#94a3b8" font-size="9">{ userPrompt }</text>

  <!-- 3. API creates public token -->
  <line x1="360" y1="225" x2="588" y2="225" stroke="#818cf8" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="475" y="218" text-anchor="middle" fill="#818cf8" font-size="10">auth.createPublicToken({ scopes: { read: { runs } } })</text>

  <!-- 4. Return runId + token -->
  <line x1="348" y1="250" x2="150" y2="250" stroke="#818cf8" stroke-width="2" marker-end="url(#arr)" stroke-dasharray="6,3"/>
  <text x="250" y="243" text-anchor="middle" fill="#c4b5fd" font-size="10">{ runId, publicAccessToken }</text>

  <!-- 5. Subscribe to streams -->
  <line x1="150" y1="270" x2="588" y2="270" stroke="#22d3ee" stroke-width="1.5" marker-end="url(#arrCyan)" stroke-dasharray="5,3"/>
  <text x="370" y="264" text-anchor="middle" fill="#22d3ee" font-size="10">useRealtimeStream(progressStream, runId) - SSE subscription</text>

  <!-- STEP 1: PARSE -->
  <line x1="600" y1="300" x2="828" y2="300" stroke="#818cf8" stroke-width="2" marker-end="url(#arr)"/>
  <text x="715" y="293" text-anchor="middle" fill="#a78bfa" font-size="10" font-weight="600">parseInfraRequest.triggerAndWait()</text>

  <!-- Progress stream -->
  <line x1="828" y1="320" x2="150" y2="320" stroke="#22d3ee" stroke-width="1" marker-end="url(#arrCyan)" stroke-dasharray="4,3"/>
  <text x="490" y="314" text-anchor="middle" fill="#22d3ee" font-size="9">progressStream: { step: "parse", status: "running" }</text>

  <!-- AI call -->
  <line x1="840" y1="345" x2="1068" y2="345" stroke="#3b82f6" stroke-width="2" marker-end="url(#arr)"/>
  <text x="955" y="338" text-anchor="middle" fill="#93c5fd" font-size="10">generateObject(gemini-2.0-flash)</text>
  <text x="955" y="358" text-anchor="middle" fill="#94a3b8" font-size="9">schema: InfrastructureRequestSchema</text>

  <!-- AI response -->
  <line x1="1068" y1="380" x2="840" y2="380" stroke="#3b82f6" stroke-width="1.5" marker-end="url(#arr)" stroke-dasharray="5,3"/>
  <text x="955" y="373" text-anchor="middle" fill="#60a5fa" font-size="9">InfrastructureRequest object</text>

  <!-- Progress stream complete -->
  <line x1="828" y1="400" x2="150" y2="400" stroke="#22d3ee" stroke-width="1" marker-end="url(#arrCyan)" stroke-dasharray="4,3"/>
  <text x="490" y="394" text-anchor="middle" fill="#22d3ee" font-size="9">progressStream: { step: "parse", status: "completed" }</text>

  <!-- Return to orchestrator -->
  <line x1="828" y1="420" x2="600" y2="420" stroke="#818cf8" stroke-width="1.5" marker-end="url(#arr)" stroke-dasharray="5,3"/>
  <text x="715" y="434" text-anchor="middle" fill="#94a3b8" font-size="9">return infraRequest</text>

  <!-- STEP 2: GENERATE -->
  <line x1="600" y1="455" x2="828" y2="455" stroke="#818cf8" stroke-width="2" marker-end="url(#arr)"/>
  <text x="715" y="448" text-anchor="middle" fill="#a78bfa" font-size="10" font-weight="600">generateTerraform.triggerAndWait()</text>

  <line x1="828" y1="475" x2="150" y2="475" stroke="#22d3ee" stroke-width="1" marker-end="url(#arrCyan)" stroke-dasharray="4,3"/>
  <text x="490" y="469" text-anchor="middle" fill="#22d3ee" font-size="9">progressStream: { step: "generate", status: "running" }</text>

  <!-- AI streamText call -->
  <line x1="840" y1="500" x2="1068" y2="500" stroke="#3b82f6" stroke-width="2" marker-end="url(#arr)"/>
  <text x="955" y="493" text-anchor="middle" fill="#93c5fd" font-size="10">streamText(gemini-2.0-flash)</text>

  <!-- Streaming response -->
  <rect x="850" y="518" width="220" height="55" rx="6" fill="#0d2137" stroke="#22d3ee" stroke-width="1" stroke-dasharray="4,2"/>
  <text x="960" y="535" text-anchor="middle" fill="#22d3ee" font-size="10" font-weight="600">STREAMING RESPONSE</text>
  <text x="960" y="550" text-anchor="middle" fill="#94a3b8" font-size="9">aiOutputStream.pipe(textStream)</text>
  <text x="960" y="565" text-anchor="middle" fill="#94a3b8" font-size="9">chunks flow to TerraformViewer</text>

  <!-- Stream chunks to browser -->
  <line x1="848" y1="545" x2="150" y2="545" stroke="#22d3ee" stroke-width="1.5" marker-end="url(#arrCyan)" stroke-dasharray="3,2"/>
  <text x="490" y="540" text-anchor="middle" fill="#22d3ee" font-size="9">aiOutputStream: "resource \"aws_instance\" { ..." (chunks)</text>

  <line x1="828" y1="585" x2="150" y2="585" stroke="#22d3ee" stroke-width="1" marker-end="url(#arrCyan)" stroke-dasharray="4,3"/>
  <text x="490" y="580" text-anchor="middle" fill="#22d3ee" font-size="9">progressStream: { step: "generate", status: "completed" }</text>

  <line x1="828" y1="605" x2="600" y2="605" stroke="#818cf8" stroke-width="1.5" marker-end="url(#arr)" stroke-dasharray="5,3"/>
  <text x="715" y="618" text-anchor="middle" fill="#94a3b8" font-size="9">return { terraformCode }</text>

  <!-- STEP 3: VALIDATE -->
  <line x1="600" y1="638" x2="828" y2="638" stroke="#818cf8" stroke-width="2" marker-end="url(#arr)"/>
  <text x="715" y="631" text-anchor="middle" fill="#a78bfa" font-size="10" font-weight="600">validateAndEstimate.triggerAndWait()</text>

  <!-- Validate AI call -->
  <line x1="840" y1="660" x2="1068" y2="660" stroke="#3b82f6" stroke-width="2" marker-end="url(#arr)"/>
  <text x="955" y="653" text-anchor="middle" fill="#93c5fd" font-size="10">generateObject() - validate</text>

  <line x1="1068" y1="680" x2="840" y2="680" stroke="#3b82f6" stroke-width="1.5" marker-end="url(#arr)" stroke-dasharray="5,3"/>
  <text x="955" y="674" text-anchor="middle" fill="#60a5fa" font-size="9">{ valid: true/false }</text>

  <!-- Fix loop (optional) -->
  <rect x="850" y="695" width="220" height="40" rx="6" fill="#451a03" stroke="#f97316" stroke-width="1" stroke-dasharray="4,2"/>
  <text x="960" y="712" text-anchor="middle" fill="#fb923c" font-size="9">If invalid: generateText() to fix + recursive validate</text>
  <text x="960" y="727" text-anchor="middle" fill="#94a3b8" font-size="9">Up to 3 attempts</text>

  <!-- Cost estimate AI call -->
  <line x1="840" y1="750" x2="1068" y2="750" stroke="#3b82f6" stroke-width="2" marker-end="url(#arr)"/>
  <text x="955" y="743" text-anchor="middle" fill="#93c5fd" font-size="10">generateObject() - cost estimate</text>

  <line x1="1068" y1="770" x2="840" y2="770" stroke="#3b82f6" stroke-width="1.5" marker-end="url(#arr)" stroke-dasharray="5,3"/>
  <text x="955" y="764" text-anchor="middle" fill="#60a5fa" font-size="9">{ monthlyCost, breakdown }</text>

  <line x1="828" y1="795" x2="150" y2="795" stroke="#22d3ee" stroke-width="1" marker-end="url(#arrCyan)" stroke-dasharray="4,3"/>
  <text x="490" y="789" text-anchor="middle" fill="#22d3ee" font-size="9">progressStream: { step: "cost", status: "completed", data: { costEstimate } }</text>

  <line x1="828" y1="815" x2="600" y2="815" stroke="#818cf8" stroke-width="1.5" marker-end="url(#arr)" stroke-dasharray="5,3"/>
  <text x="715" y="828" text-anchor="middle" fill="#94a3b8" font-size="9">return { terraformCode, costEstimate }</text>

  <!-- STEP 4: APPROVAL -->
  <!-- Create token -->
  <rect x="605" y="840" width="220" height="25" rx="4" fill="#451a03" stroke="#f59e0b" stroke-width="1"/>
  <text x="715" y="858" text-anchor="middle" fill="#fde68a" font-size="10">wait.createToken({ timeout: "30m" })</text>

  <!-- Send approval data to frontend -->
  <line x1="595" y1="878" x2="150" y2="878" stroke="#22d3ee" stroke-width="1.5" marker-end="url(#arrCyan)" stroke-dasharray="4,3"/>
  <text x="370" y="872" text-anchor="middle" fill="#22d3ee" font-size="9">progressStream: { step: "approval", data: { terraformCode, costEstimate, tokenId } }</text>

  <!-- Task pauses -->
  <rect x="560" y="895" width="70" height="95" rx="4" fill="#451a03" stroke="#f59e0b" stroke-width="1.5" stroke-dasharray="5,3"/>
  <text x="595" y="935" text-anchor="middle" fill="#fbbf24" font-size="10" font-weight="bold" transform="rotate(-90, 595, 935)">PAUSED</text>

  <!-- User sees approval panel -->
  <rect x="90" y="900" width="115" height="40" rx="6" fill="#1e1b4b" stroke="#6366f1" stroke-width="1"/>
  <text x="147" y="917" text-anchor="middle" fill="#c4b5fd" font-size="9">ApprovalPanel</text>
  <text x="147" y="932" text-anchor="middle" fill="#94a3b8" font-size="9">shows cost + code</text>

  <!-- User clicks approve -->
  <line x1="150" y1="960" x2="348" y2="960" stroke="#fbbf24" stroke-width="2" marker-end="url(#arrOrange)"/>
  <text x="250" y="953" text-anchor="middle" fill="#fde68a" font-size="10" font-weight="600">POST /api/approve</text>
  <text x="250" y="973" text-anchor="middle" fill="#94a3b8" font-size="9">{ tokenId, approved: true }</text>

  <!-- API completes token -->
  <line x1="360" y1="995" x2="588" y2="995" stroke="#fbbf24" stroke-width="2" marker-end="url(#arrOrange)"/>
  <text x="475" y="988" text-anchor="middle" fill="#fde68a" font-size="10">wait.completeToken(tokenId, { approved: true })</text>

  <!-- Task resumes -->
  <text x="595" y="1025" text-anchor="middle" fill="#34d399" font-size="11" font-weight="bold">TASK RESUMES</text>

  <!-- STEP 5: DEPLOY -->
  <line x1="600" y1="1070" x2="828" y2="1070" stroke="#818cf8" stroke-width="2" marker-end="url(#arr)"/>
  <text x="715" y="1063" text-anchor="middle" fill="#a78bfa" font-size="10" font-weight="600">deployTerraform.triggerAndWait()</text>

  <!-- Write file -->
  <rect x="850" y="1088" width="180" height="22" rx="4" fill="#022c22" stroke="#10b981" stroke-width="1"/>
  <text x="940" y="1103" text-anchor="middle" fill="#6ee7b7" font-size="9">writeFile("generated/{project}/main.tf")</text>

  <!-- terraform init -->
  <line x1="840" y1="1125" x2="1288" y2="1125" stroke="#34d399" stroke-width="2" marker-end="url(#arrGreen)"/>
  <text x="1065" y="1118" text-anchor="middle" fill="#6ee7b7" font-size="10" font-weight="600">execFile("terraform", ["init"])</text>

  <line x1="1288" y1="1145" x2="840" y2="1145" stroke="#34d399" stroke-width="1.5" marker-end="url(#arrGreen)" stroke-dasharray="5,3"/>
  <text x="1065" y="1139" text-anchor="middle" fill="#94a3b8" font-size="9">init stdout</text>

  <line x1="828" y1="1155" x2="150" y2="1155" stroke="#22d3ee" stroke-width="1" marker-end="url(#arrCyan)" stroke-dasharray="4,3"/>
  <text x="490" y="1150" text-anchor="middle" fill="#22d3ee" font-size="9">terraformOutputStream: init output</text>

  <!-- terraform apply -->
  <line x1="840" y1="1180" x2="1288" y2="1180" stroke="#34d399" stroke-width="2" marker-end="url(#arrGreen)"/>
  <text x="1065" y="1173" text-anchor="middle" fill="#6ee7b7" font-size="10" font-weight="600">execFile("terraform", ["apply", "-auto-approve"])</text>

  <line x1="1288" y1="1200" x2="840" y2="1200" stroke="#34d399" stroke-width="1.5" marker-end="url(#arrGreen)" stroke-dasharray="5,3"/>
  <text x="1065" y="1194" text-anchor="middle" fill="#94a3b8" font-size="9">apply stdout (EC2 created!)</text>

  <line x1="828" y1="1215" x2="150" y2="1215" stroke="#22d3ee" stroke-width="1" marker-end="url(#arrCyan)" stroke-dasharray="4,3"/>
  <text x="490" y="1210" text-anchor="middle" fill="#22d3ee" font-size="9">terraformOutputStream: apply output</text>

  <!-- Final stream -->
  <line x1="828" y1="1240" x2="150" y2="1240" stroke="#22d3ee" stroke-width="1.5" marker-end="url(#arrCyan)" stroke-dasharray="4,3"/>
  <text x="490" y="1234" text-anchor="middle" fill="#34d399" font-size="10" font-weight="600">progressStream: { step: "deploy", status: "completed" }</text>

  <!-- Final result -->
  <rect x="100" y="1255" width="250" height="25" rx="6" fill="#022c22" stroke="#10b981" stroke-width="2"/>
  <text x="225" y="1272" text-anchor="middle" fill="#6ee7b7" font-size="11" font-weight="bold">Infrastructure LIVE on AWS!</text>
</svg>
