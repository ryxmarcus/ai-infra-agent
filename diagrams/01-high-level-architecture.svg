<svg viewBox="0 0 1400 900" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', system-ui, sans-serif">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0a1a"/>
      <stop offset="100%" style="stop-color:#111133"/>
    </linearGradient>
    <linearGradient id="nextGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#000000"/>
      <stop offset="100%" style="stop-color:#1a1a2e"/>
    </linearGradient>
    <linearGradient id="triggerGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a0033"/>
      <stop offset="100%" style="stop-color:#2d1b69"/>
    </linearGradient>
    <linearGradient id="aiGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0d2137"/>
      <stop offset="100%" style="stop-color:#1a3a5c"/>
    </linearGradient>
    <linearGradient id="cloudGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a2e0d"/>
      <stop offset="100%" style="stop-color:#2d5c1a"/>
    </linearGradient>
    <linearGradient id="arrowGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#6366f1"/>
      <stop offset="100%" style="stop-color:#a855f7"/>
    </linearGradient>
    <linearGradient id="streamGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#22d3ee"/>
      <stop offset="100%" style="stop-color:#06b6d4"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge><feMergeNode in="coloredBlur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="softShadow">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000" flood-opacity="0.5"/>
    </filter>
    <marker id="arrowHead" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#a855f7"/>
    </marker>
    <marker id="streamArrow" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#22d3ee"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="1400" height="900" fill="url(#bgGrad)"/>

  <!-- Title -->
  <text x="700" y="55" text-anchor="middle" fill="#e2e8f0" font-size="28" font-weight="bold">High-Level Architecture: AI Cloud Infrastructure Agent</text>
  <text x="700" y="82" text-anchor="middle" fill="#94a3b8" font-size="14">Natural Language to Cloud Infrastructure in 5 Steps</text>

  <!-- USER LAYER -->
  <text x="70" y="140" fill="#94a3b8" font-size="13" font-weight="600" letter-spacing="2">USER</text>
  <rect x="60" y="155" width="200" height="120" rx="16" fill="#1e1e2e" stroke="#6366f1" stroke-width="2" filter="url(#softShadow)"/>
  <text x="160" y="200" text-anchor="middle" fill="#c4b5fd" font-size="36">&#x1F9D1;&#x200D;&#x1F4BB;</text>
  <text x="160" y="235" text-anchor="middle" fill="#e2e8f0" font-size="14" font-weight="600">Developer</text>
  <text x="160" y="255" text-anchor="middle" fill="#94a3b8" font-size="11">"Deploy EC2 in eu-north-1"</text>

  <!-- NEXT.JS LAYER -->
  <text x="370" y="140" fill="#94a3b8" font-size="13" font-weight="600" letter-spacing="2">FRONTEND + API</text>
  <rect x="350" y="155" width="280" height="260" rx="16" fill="url(#nextGrad)" stroke="#555" stroke-width="1.5" filter="url(#softShadow)"/>

  <!-- Next.js logo text -->
  <rect x="375" y="168" width="90" height="24" rx="4" fill="#000" stroke="#fff" stroke-width="1"/>
  <text x="420" y="185" text-anchor="middle" fill="#fff" font-size="12" font-weight="bold">Next.js 15</text>

  <!-- Frontend components -->
  <rect x="375" y="205" width="230" height="40" rx="8" fill="#1a1a2e" stroke="#6366f1" stroke-width="1"/>
  <text x="490" y="230" text-anchor="middle" fill="#c4b5fd" font-size="12">AgentDashboard.tsx</text>
  <rect x="375" y="255" width="110" height="35" rx="8" fill="#1a1a2e" stroke="#818cf8" stroke-width="1"/>
  <text x="430" y="277" text-anchor="middle" fill="#a5b4fc" font-size="11">ProgressTimeline</text>
  <rect x="495" y="255" width="110" height="35" rx="8" fill="#1a1a2e" stroke="#818cf8" stroke-width="1"/>
  <text x="550" y="277" text-anchor="middle" fill="#a5b4fc" font-size="11">TerraformViewer</text>
  <rect x="375" y="300" width="110" height="35" rx="8" fill="#1a1a2e" stroke="#818cf8" stroke-width="1"/>
  <text x="430" y="322" text-anchor="middle" fill="#a5b4fc" font-size="11">ApprovalPanel</text>

  <!-- API Routes -->
  <rect x="375" y="350" width="72" height="28" rx="6" fill="#0d1117" stroke="#f97316" stroke-width="1"/>
  <text x="411" y="368" text-anchor="middle" fill="#fb923c" font-size="10">/api/agent</text>
  <rect x="457" y="350" width="80" height="28" rx="6" fill="#0d1117" stroke="#f97316" stroke-width="1"/>
  <text x="497" y="368" text-anchor="middle" fill="#fb923c" font-size="10">/api/approve</text>
  <rect x="547" y="350" width="60" height="28" rx="6" fill="#0d1117" stroke="#f97316" stroke-width="1"/>
  <text x="577" y="368" text-anchor="middle" fill="#fb923c" font-size="10">/api/save</text>

  <!-- TRIGGER.DEV LAYER -->
  <text x="720" y="140" fill="#94a3b8" font-size="13" font-weight="600" letter-spacing="2">ORCHESTRATION</text>
  <rect x="700" y="155" width="320" height="360" rx="16" fill="url(#triggerGrad)" stroke="#7c3aed" stroke-width="2" filter="url(#softShadow)"/>

  <rect x="725" y="168" width="120" height="24" rx="4" fill="#7c3aed" stroke="none"/>
  <text x="785" y="185" text-anchor="middle" fill="#fff" font-size="12" font-weight="bold">Trigger.dev</text>

  <!-- Orchestrator -->
  <rect x="725" y="205" width="270" height="40" rx="8" fill="#2d1b69" stroke="#a78bfa" stroke-width="1.5"/>
  <text x="860" y="230" text-anchor="middle" fill="#ddd6fe" font-size="13" font-weight="600">Orchestrator Task</text>

  <!-- Sub-tasks -->
  <rect x="725" y="260" width="130" height="35" rx="8" fill="#1a0033" stroke="#8b5cf6" stroke-width="1"/>
  <text x="730" y="273" fill="#c4b5fd" font-size="10" font-weight="600">Step 1</text>
  <text x="790" y="285" text-anchor="middle" fill="#c4b5fd" font-size="10">parse-request</text>

  <rect x="865" y="260" width="130" height="35" rx="8" fill="#1a0033" stroke="#8b5cf6" stroke-width="1"/>
  <text x="870" y="273" fill="#c4b5fd" font-size="10" font-weight="600">Step 2</text>
  <text x="930" y="285" text-anchor="middle" fill="#c4b5fd" font-size="10">generate-terraform</text>

  <rect x="725" y="305" width="130" height="35" rx="8" fill="#1a0033" stroke="#8b5cf6" stroke-width="1"/>
  <text x="730" y="318" fill="#c4b5fd" font-size="10" font-weight="600">Step 3</text>
  <text x="790" y="330" text-anchor="middle" fill="#c4b5fd" font-size="10">validate-estimate</text>

  <rect x="865" y="305" width="130" height="35" rx="8" fill="#1a0033" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="870" y="318" fill="#fbbf24" font-size="10" font-weight="600">Step 4</text>
  <text x="930" y="330" text-anchor="middle" fill="#fbbf24" font-size="10">wait.forToken</text>

  <rect x="725" y="355" width="270" height="35" rx="8" fill="#1a0033" stroke="#10b981" stroke-width="1.5"/>
  <text x="730" y="368" fill="#34d399" font-size="10" font-weight="600">Step 5</text>
  <text x="860" y="380" text-anchor="middle" fill="#34d399" font-size="11">deploy-terraform</text>

  <!-- Streams -->
  <text x="740" y="418" fill="#94a3b8" font-size="10" font-weight="600">REAL-TIME STREAMS</text>
  <rect x="725" y="425" width="85" height="25" rx="5" fill="#0d2137" stroke="#22d3ee" stroke-width="1"/>
  <text x="767" y="442" text-anchor="middle" fill="#22d3ee" font-size="9">progressStream</text>
  <rect x="820" y="425" width="85" height="25" rx="5" fill="#0d2137" stroke="#22d3ee" stroke-width="1"/>
  <text x="862" y="442" text-anchor="middle" fill="#22d3ee" font-size="9">aiOutputStream</text>
  <rect x="915" y="425" width="85" height="25" rx="5" fill="#0d2137" stroke="#22d3ee" stroke-width="1"/>
  <text x="957" y="442" text-anchor="middle" fill="#22d3ee" font-size="9">terraformOutput</text>

  <!-- Wait token label -->
  <rect x="865" y="465" width="130" height="25" rx="5" fill="#1a0033" stroke="#f59e0b" stroke-width="1"/>
  <text x="930" y="482" text-anchor="middle" fill="#fbbf24" font-size="9">wait.createToken / completeToken</text>

  <!-- AI LAYER -->
  <text x="720" y="560" fill="#94a3b8" font-size="13" font-weight="600" letter-spacing="2">AI ENGINE</text>
  <rect x="700" y="575" width="320" height="100" rx="16" fill="url(#aiGrad)" stroke="#3b82f6" stroke-width="1.5" filter="url(#softShadow)"/>
  <rect x="725" y="588" width="90" height="24" rx="4" fill="#1d4ed8" stroke="none"/>
  <text x="770" y="605" text-anchor="middle" fill="#fff" font-size="12" font-weight="bold">Gemini 2.0</text>
  <text x="860" y="605" fill="#93c5fd" font-size="11">Vercel AI SDK</text>

  <text x="725" y="635" fill="#bfdbfe" font-size="11">generateObject() - Parse &amp; Validate</text>
  <text x="725" y="655" fill="#bfdbfe" font-size="11">streamText() - Generate Terraform (real-time)</text>
  <text x="725" y="665" fill="#bfdbfe" font-size="0"> </text>

  <!-- CLOUD LAYER -->
  <text x="720" y="730" fill="#94a3b8" font-size="13" font-weight="600" letter-spacing="2">CLOUD PROVIDERS</text>
  <rect x="700" y="745" width="320" height="100" rx="16" fill="url(#cloudGrad)" stroke="#22c55e" stroke-width="1.5" filter="url(#softShadow)"/>

  <rect x="725" y="770" width="80" height="50" rx="8" fill="#1a2e0d" stroke="#f97316" stroke-width="1.5"/>
  <text x="765" y="792" text-anchor="middle" fill="#fb923c" font-size="13" font-weight="bold">AWS</text>
  <text x="765" y="808" text-anchor="middle" fill="#94a3b8" font-size="9">EC2, S3, RDS</text>

  <rect x="820" y="770" width="80" height="50" rx="8" fill="#1a2e0d" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="860" y="792" text-anchor="middle" fill="#60a5fa" font-size="13" font-weight="bold">GCP</text>
  <text x="860" y="808" text-anchor="middle" fill="#94a3b8" font-size="9">GCE, GCS, SQL</text>

  <rect x="915" y="770" width="80" height="50" rx="8" fill="#1a2e0d" stroke="#06b6d4" stroke-width="1.5"/>
  <text x="955" y="792" text-anchor="middle" fill="#22d3ee" font-size="13" font-weight="bold">Azure</text>
  <text x="955" y="808" text-anchor="middle" fill="#94a3b8" font-size="9">VM, Blob, DB</text>

  <!-- Terraform in the middle -->
  <rect x="1090" y="760" width="120" height="70" rx="12" fill="#1e1e2e" stroke="#7c3aed" stroke-width="2" filter="url(#softShadow)"/>
  <text x="1150" y="793" text-anchor="middle" fill="#a78bfa" font-size="15" font-weight="bold">Terraform</text>
  <text x="1150" y="812" text-anchor="middle" fill="#94a3b8" font-size="10">init + apply</text>

  <!-- ARROWS -->
  <!-- User -> Next.js -->
  <line x1="260" y1="215" x2="345" y2="215" stroke="url(#arrowGrad)" stroke-width="2.5" marker-end="url(#arrowHead)"/>
  <text x="302" y="208" text-anchor="middle" fill="#a855f7" font-size="9">prompt</text>

  <!-- Next.js API -> Trigger.dev -->
  <line x1="630" y1="365" x2="695" y2="225" stroke="url(#arrowGrad)" stroke-width="2.5" marker-end="url(#arrowHead)"/>
  <text x="650" y="280" fill="#a855f7" font-size="9" transform="rotate(-60, 650, 280)">trigger()</text>

  <!-- Streams -> Next.js frontend -->
  <path d="M 725 440 C 660 440, 640 270, 605 270" stroke="url(#streamGrad)" stroke-width="2" fill="none" stroke-dasharray="6,4" marker-end="url(#streamArrow)"/>
  <text x="650" y="370" fill="#22d3ee" font-size="9">real-time streams</text>

  <!-- Trigger.dev -> AI -->
  <line x1="860" y1="500" x2="860" y2="570" stroke="url(#arrowGrad)" stroke-width="2" marker-end="url(#arrowHead)"/>
  <text x="875" y="540" fill="#a855f7" font-size="9">AI SDK calls</text>

  <!-- Trigger.dev -> Cloud (via Terraform) -->
  <line x1="860" y1="395" x2="860" y2="505" stroke="transparent"/>
  <path d="M 860 500 L 860 520 C 860 530, 1150 700, 1150 755" stroke="#22c55e" stroke-width="2" fill="none" marker-end="url(#arrowHead)" stroke-dasharray="6,4"/>

  <!-- Terraform -> Cloud providers -->
  <line x1="1090" y1="795" x2="1000" y2="795" stroke="#22c55e" stroke-width="2" marker-end="url(#arrowHead)"/>

  <!-- Approval loop: Next.js -> Trigger.dev -->
  <path d="M 497 378 C 497 470, 700 490, 930 490" stroke="#f59e0b" stroke-width="2" fill="none" stroke-dasharray="5,3" marker-end="url(#arrowHead)"/>
  <text x="680" y="488" fill="#fbbf24" font-size="9">wait.completeToken()</text>

  <!-- LEGEND -->
  <rect x="60" y="780" width="250" height="100" rx="12" fill="#111" stroke="#333" stroke-width="1"/>
  <text x="80" y="802" fill="#e2e8f0" font-size="12" font-weight="600">Legend</text>
  <line x1="80" y1="818" x2="110" y2="818" stroke="#a855f7" stroke-width="2.5"/>
  <text x="118" y="822" fill="#94a3b8" font-size="10">Request / Trigger flow</text>
  <line x1="80" y1="838" x2="110" y2="838" stroke="#22d3ee" stroke-width="2" stroke-dasharray="6,4"/>
  <text x="118" y="842" fill="#94a3b8" font-size="10">Real-time stream (SSE)</text>
  <line x1="80" y1="858" x2="110" y2="858" stroke="#f59e0b" stroke-width="2" stroke-dasharray="5,3"/>
  <text x="118" y="862" fill="#94a3b8" font-size="10">Human-in-the-loop approval</text>

  <!-- Tech stack badges -->
  <rect x="60" y="330" width="200" height="85" rx="12" fill="#111" stroke="#333" stroke-width="1"/>
  <text x="80" y="352" fill="#e2e8f0" font-size="12" font-weight="600">Tech Stack</text>
  <text x="80" y="372" fill="#94a3b8" font-size="10">Next.js 15 + React 19</text>
  <text x="80" y="388" fill="#94a3b8" font-size="10">Trigger.dev v4 (Orchestration)</text>
  <text x="80" y="404" fill="#94a3b8" font-size="10">Gemini 2.0 Flash (AI) + Terraform</text>
</svg>
