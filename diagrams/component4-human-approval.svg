<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1200 700" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0a1a"/>
      <stop offset="100%" style="stop-color:#111133"/>
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0d1f2a"/>
      <stop offset="100%" style="stop-color:#0e3a4a"/>
    </linearGradient>
    <linearGradient id="pauseGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a0d"/>
      <stop offset="100%" style="stop-color:#2e2e1a"/>
    </linearGradient>
    <linearGradient id="frontendGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a0d2e"/>
      <stop offset="100%" style="stop-color:#2d1b69"/>
    </linearGradient>
    <linearGradient id="arrowGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#22d3ee"/>
      <stop offset="100%" style="stop-color:#67e8f9"/>
    </linearGradient>
    <linearGradient id="approveGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#22c55e"/>
      <stop offset="100%" style="stop-color:#4ade80"/>
    </linearGradient>
    <linearGradient id="rejectGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#ef4444"/>
      <stop offset="100%" style="stop-color:#f87171"/>
    </linearGradient>
    <linearGradient id="streamGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#22d3ee"/>
      <stop offset="100%" style="stop-color:#06b6d4"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge><feMergeNode in="coloredBlur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="softShadow">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000" flood-opacity="0.5"/>
    </filter>
    <marker id="cyanArrow" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#22d3ee"/>
    </marker>
    <marker id="greenArrow" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#22c55e"/>
    </marker>
    <marker id="orangeArrow" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#f59e0b"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="1200" height="700" fill="url(#bgGrad)"/>

  <!-- Title -->
  <text x="600" y="45" text-anchor="middle" fill="#e2e8f0" font-size="26" font-weight="bold">Component 4: Human-in-the-Loop Approval</text>
  <text x="600" y="72" text-anchor="middle" fill="#94a3b8" font-size="13">wait.forToken() — Task Pauses Until Human Decides</text>
  <rect x="530" y="80" width="140" height="22" rx="11" fill="#0e3a4a" stroke="#22d3ee" stroke-width="1"/>
  <text x="600" y="95" text-anchor="middle" fill="#67e8f9" font-size="10" font-weight="600">STEP 4 — CYAN</text>

  <!-- ═══════════ PHASE 1: CREATE TOKEN ═══════════ -->
  <text x="60" y="135" fill="#94a3b8" font-size="11" font-weight="600" letter-spacing="2">PHASE 1: CREATE WAIT TOKEN</text>
  <rect x="50" y="148" width="340" height="130" rx="14" fill="url(#cyanGrad)" stroke="#22d3ee" stroke-width="2" filter="url(#softShadow)"/>

  <rect x="70" y="165" width="300" height="42" rx="8" fill="#0d1f2a" stroke="#67e8f9" stroke-width="1.5" filter="url(#glow)"/>
  <text x="220" y="186" text-anchor="middle" fill="#67e8f9" font-size="13" font-weight="bold">wait.createToken()</text>
  <text x="220" y="200" text-anchor="middle" fill="#64748b" font-size="9">Trigger.dev Wait API</text>

  <rect x="70" y="215" width="145" height="28" rx="6" fill="#0d1f2a" stroke="#22d3ee" stroke-width="0.5"/>
  <text x="80" y="233" fill="#67e8f9" font-size="10">timeout: "30m"</text>

  <rect x="225" y="215" width="145" height="28" rx="6" fill="#0d1f2a" stroke="#22d3ee" stroke-width="0.5"/>
  <text x="235" y="233" fill="#67e8f9" font-size="10">returns: tokenId</text>

  <text x="220" y="268" text-anchor="middle" fill="#94a3b8" font-size="9">Token expires after 30 minutes if no action taken</text>

  <!-- Arrow: Token -> Send to Frontend -->
  <line x1="390" y1="210" x2="460" y2="210" stroke="url(#arrowGrad)" stroke-width="2.5" marker-end="url(#cyanArrow)"/>

  <!-- ═══════════ PHASE 2: SEND DATA TO FRONTEND ═══════════ -->
  <text x="480" y="135" fill="#94a3b8" font-size="11" font-weight="600" letter-spacing="2">PHASE 2: STREAM TO FRONTEND</text>
  <rect x="470" y="148" width="300" height="130" rx="14" fill="url(#cyanGrad)" stroke="#22d3ee" stroke-width="2" filter="url(#softShadow)"/>

  <rect x="490" y="165" width="260" height="35" rx="8" fill="#0d1f2a" stroke="#22d3ee" stroke-width="1"/>
  <text x="620" y="187" text-anchor="middle" fill="#67e8f9" font-size="12" font-weight="600">progressStream.write()</text>

  <rect x="490" y="208" width="125" height="25" rx="5" fill="#0d1f2a" stroke="#22d3ee" stroke-width="0.5"/>
  <text x="552" y="225" text-anchor="middle" fill="#a5f3fc" font-size="9">tokenId</text>

  <rect x="625" y="208" width="125" height="25" rx="5" fill="#0d1f2a" stroke="#22d3ee" stroke-width="0.5"/>
  <text x="687" y="225" text-anchor="middle" fill="#a5f3fc" font-size="9">costEstimate</text>

  <rect x="490" y="241" width="260" height="25" rx="5" fill="#0d1f2a" stroke="#22d3ee" stroke-width="0.5"/>
  <text x="620" y="258" text-anchor="middle" fill="#a5f3fc" font-size="9">terraformCode + validation results</text>

  <!-- ═══════════ TASK PAUSES ═══════════ -->
  <rect x="830" y="148" width="330" height="55" rx="14" fill="url(#pauseGrad)" stroke="#f59e0b" stroke-width="2.5" filter="url(#glow)"/>
  <text x="995" y="175" text-anchor="middle" fill="#fbbf24" font-size="18" font-weight="bold" class="pulse">TASK PAUSED</text>
  <text x="995" y="195" text-anchor="middle" fill="#94a3b8" font-size="10">No compute consumed — waiting for human</text>

  <line x1="770" y1="180" x2="825" y2="175" stroke="#f59e0b" stroke-width="2" marker-end="url(#orangeArrow)"/>

  <!-- ═══════════ FRONTEND: APPROVAL PANEL ═══════════ -->
  <text x="60" y="325" fill="#94a3b8" font-size="11" font-weight="600" letter-spacing="2">FRONTEND: APPROVAL UI</text>
  <rect x="50" y="338" width="520" height="200" rx="16" fill="url(#frontendGrad)" stroke="#6366f1" stroke-width="2" filter="url(#softShadow)"/>

  <rect x="70" y="355" width="120" height="22" rx="4" fill="#6366f1"/>
  <text x="130" y="371" text-anchor="middle" fill="#fff" font-size="10" font-weight="bold">ApprovalPanel</text>

  <!-- Cost breakdown -->
  <rect x="70" y="390" width="230" height="120" rx="10" fill="#1a0d2e" stroke="#818cf8" stroke-width="1"/>
  <text x="80" y="410" fill="#c4b5fd" font-size="10" font-weight="600">Cost Breakdown</text>
  <text x="80" y="430" fill="#94a3b8" font-size="9">EC2 t3.medium .......... $30.37/mo</text>
  <text x="80" y="446" fill="#94a3b8" font-size="9">RDS db.t3.micro ........ $14.40/mo</text>
  <text x="80" y="462" fill="#94a3b8" font-size="9">S3 Standard ............ $2.30/mo</text>
  <line x1="80" y1="472" x2="280" y2="472" stroke="#475569" stroke-width="0.5"/>
  <text x="80" y="488" fill="#e2e8f0" font-size="10" font-weight="600">Total: ~$47.07/mo</text>
  <text x="80" y="502" fill="#64748b" font-size="8">AI-estimated, actual may vary</text>

  <!-- Terraform preview -->
  <rect x="320" y="390" width="230" height="80" rx="10" fill="#0d0d1a" stroke="#818cf8" stroke-width="1"/>
  <text x="330" y="410" fill="#c4b5fd" font-size="10" font-weight="600">Terraform Preview</text>
  <text x="330" y="430" fill="#a78bfa" font-size="9" font-family="monospace">provider "aws" { ... }</text>
  <text x="330" y="446" fill="#a78bfa" font-size="9" font-family="monospace">resource "aws_instance"</text>
  <text x="330" y="462" fill="#a78bfa" font-size="9" font-family="monospace">  { ... }</text>

  <!-- Buttons -->
  <rect x="320" y="485" width="105" height="35" rx="8" fill="#166534" stroke="#22c55e" stroke-width="2"/>
  <text x="372" y="507" text-anchor="middle" fill="#4ade80" font-size="12" font-weight="bold">Approve</text>

  <rect x="440" y="485" width="105" height="35" rx="8" fill="#7f1d1d" stroke="#ef4444" stroke-width="2"/>
  <text x="492" y="507" text-anchor="middle" fill="#f87171" font-size="12" font-weight="bold">Reject</text>

  <!-- Stream down arrow from Phase 2 to Frontend -->
  <path d="M 620 278 C 620 310, 400 330, 310 338" stroke="url(#streamGrad)" stroke-width="2" fill="none" stroke-dasharray="6,4" class="animated-line" marker-end="url(#cyanArrow)"/>

  <!-- ═══════════ PHASE 3: USER ACTION -> API ═══════════ -->
  <text x="640" y="325" fill="#94a3b8" font-size="11" font-weight="600" letter-spacing="2">PHASE 3: USER DECISION</text>
  <rect x="630" y="338" width="280" height="130" rx="14" fill="url(#cyanGrad)" stroke="#22d3ee" stroke-width="2" filter="url(#softShadow)"/>

  <text x="770" y="365" text-anchor="middle" fill="#e2e8f0" font-size="12" font-weight="600">User clicks Approve or Reject</text>

  <rect x="650" y="380" width="240" height="35" rx="8" fill="#0d1f2a" stroke="#f97316" stroke-width="1.5"/>
  <text x="770" y="402" text-anchor="middle" fill="#fb923c" font-size="12" font-weight="bold">POST /api/approve</text>

  <rect x="650" y="425" width="240" height="28" rx="6" fill="#0d1f2a" stroke="#22d3ee" stroke-width="0.5"/>
  <text x="770" y="443" text-anchor="middle" fill="#a5f3fc" font-size="10">body: { runId, tokenId, approved: boolean }</text>

  <!-- Arrow: Frontend -> API -->
  <line x1="570" y1="502" x2="645" y2="438" stroke="#f97316" stroke-width="2" marker-end="url(#orangeArrow)"/>
  <text x="595" y="460" fill="#fb923c" font-size="9">click</text>

  <!-- ═══════════ PHASE 4: COMPLETE TOKEN ═══════════ -->
  <text x="640" y="500" fill="#94a3b8" font-size="11" font-weight="600" letter-spacing="2">PHASE 4: RESUME TASK</text>
  <rect x="630" y="513" width="280" height="100" rx="14" fill="url(#cyanGrad)" stroke="#22d3ee" stroke-width="2" filter="url(#softShadow)"/>

  <rect x="650" y="530" width="240" height="38" rx="8" fill="#0d1f2a" stroke="#67e8f9" stroke-width="1.5" filter="url(#glow)"/>
  <text x="770" y="551" text-anchor="middle" fill="#67e8f9" font-size="13" font-weight="bold">wait.completeToken()</text>
  <text x="770" y="563" text-anchor="middle" fill="#64748b" font-size="9">tokenId, { approved: true/false }</text>

  <rect x="650" y="575" width="240" height="28" rx="6" fill="#0d1f2a" stroke="#22c55e" stroke-width="0.5"/>
  <text x="770" y="593" text-anchor="middle" fill="#4ade80" font-size="10" font-weight="600">TASK RESUMES with approval result</text>

  <!-- Arrow from Phase 3 to Phase 4 -->
  <line x1="770" y1="468" x2="770" y2="508" stroke="url(#arrowGrad)" stroke-width="2" marker-end="url(#cyanArrow)"/>

  <!-- ═══════════ OUTPUT ═══════════ -->
  <text x="970" y="325" fill="#94a3b8" font-size="11" font-weight="600" letter-spacing="2">OUTPUT</text>
  <rect x="960" y="338" width="210" height="100" rx="14" fill="url(#cyanGrad)" stroke="#22d3ee" stroke-width="2" filter="url(#softShadow)"/>

  <rect x="980" y="358" width="170" height="28" rx="6" fill="#0d1f2a" stroke="#22c55e" stroke-width="1"/>
  <text x="1065" y="376" text-anchor="middle" fill="#4ade80" font-size="11" font-weight="600">approved: true → Step 5</text>

  <rect x="980" y="394" width="170" height="28" rx="6" fill="#0d1f2a" stroke="#ef4444" stroke-width="1"/>
  <text x="1065" y="412" text-anchor="middle" fill="#f87171" font-size="11" font-weight="600">approved: false → END</text>

  <line x1="910" y1="555" x2="960" y2="400" stroke="url(#arrowGrad)" stroke-width="2" marker-end="url(#cyanArrow)"/>

  <!-- ═══════════ INFO BOXES ═══════════ -->
  <rect x="50" y="560" width="360" height="60" rx="12" fill="#111" stroke="#333" stroke-width="1"/>
  <text x="70" y="582" fill="#e2e8f0" font-size="11" font-weight="600">Files: src/trigger/orchestrator.ts + src/app/api/approve/route.ts</text>
  <text x="70" y="600" fill="#94a3b8" font-size="10">wait.forToken() inside orchestrator | /api/approve completes the token</text>

  <rect x="50" y="635" width="540" height="50" rx="12" fill="#111" stroke="#333" stroke-width="1"/>
  <text x="70" y="657" fill="#e2e8f0" font-size="11" font-weight="600">Key Insight</text>
  <text x="70" y="673" fill="#fbbf24" font-size="10">Task uses ZERO compute while paused — resumes exactly where it left off when token completes</text>

  <rect x="960" y="460" width="210" height="80" rx="12" fill="#111" stroke="#333" stroke-width="1"/>
  <text x="980" y="482" fill="#e2e8f0" font-size="11" font-weight="600">Key Concepts</text>
  <text x="980" y="500" fill="#67e8f9" font-size="10">• wait.forToken() pauses task</text>
  <text x="980" y="516" fill="#fbbf24" font-size="10">• 30m timeout auto-expires</text>
  <text x="980" y="532" fill="#4ade80" font-size="10">• Zero compute while waiting</text>
</svg>
