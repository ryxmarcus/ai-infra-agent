<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1200 700" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0a1a"/>
      <stop offset="100%" style="stop-color:#111133"/>
    </linearGradient>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0d1b3a"/>
      <stop offset="100%" style="stop-color:#1e3a5f"/>
    </linearGradient>
    <linearGradient id="aiGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0d2137"/>
      <stop offset="100%" style="stop-color:#1a3a5c"/>
    </linearGradient>
    <linearGradient id="outputGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0d2a1a"/>
      <stop offset="100%" style="stop-color:#1a4a2e"/>
    </linearGradient>
    <linearGradient id="arrowGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#3b82f6"/>
      <stop offset="100%" style="stop-color:#60a5fa"/>
    </linearGradient>
    <linearGradient id="streamGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#22d3ee"/>
      <stop offset="100%" style="stop-color:#06b6d4"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge><feMergeNode in="coloredBlur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="softShadow">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000" flood-opacity="0.5"/>
    </filter>
    <marker id="arrowHead" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#3b82f6"/>
    </marker>
    <marker id="streamArrow" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#22d3ee"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="1200" height="700" fill="url(#bgGrad)"/>

  <!-- Title -->
  <text x="600" y="45" text-anchor="middle" fill="#e2e8f0" font-size="26" font-weight="bold">Component 1: AI Request Parser</text>
  <text x="600" y="72" text-anchor="middle" fill="#94a3b8" font-size="13">parseInfraRequest — Natural Language → Structured Infrastructure Specification</text>
  <rect x="540" y="80" width="120" height="22" rx="11" fill="#1e3a5f" stroke="#3b82f6" stroke-width="1"/>
  <text x="600" y="95" text-anchor="middle" fill="#60a5fa" font-size="10" font-weight="600">STEP 1 — BLUE</text>

  <!-- ═══════════ INPUT ═══════════ -->
  <text x="60" y="145" fill="#94a3b8" font-size="12" font-weight="600" letter-spacing="2">INPUT</text>
  <rect x="50" y="160" width="220" height="110" rx="14" fill="url(#blueGrad)" stroke="#3b82f6" stroke-width="2" filter="url(#softShadow)"/>
  <text x="160" y="195" text-anchor="middle" fill="#93c5fd" font-size="14" font-weight="600">userPrompt</text>
  <text x="160" y="215" text-anchor="middle" fill="#64748b" font-size="11">string</text>
  <rect x="70" y="230" width="180" height="24" rx="6" fill="#0d1b3a" stroke="#3b82f6" stroke-width="0.5"/>
  <text x="160" y="246" text-anchor="middle" fill="#94a3b8" font-size="9">"Deploy EC2 in eu-north-1"</text>

  <!-- Arrow: Input -> AI Call -->
  <line x1="270" y1="215" x2="370" y2="215" stroke="url(#arrowGrad)" stroke-width="2.5" marker-end="url(#arrowHead)"/>

  <!-- ═══════════ CORE: AI CALL ═══════════ -->
  <text x="390" y="145" fill="#94a3b8" font-size="12" font-weight="600" letter-spacing="2">AI PROCESSING</text>
  <rect x="380" y="160" width="440" height="320" rx="16" fill="url(#blueGrad)" stroke="#3b82f6" stroke-width="2" filter="url(#softShadow)"/>

  <!-- generateObject box -->
  <rect x="405" y="180" width="390" height="50" rx="10" fill="#0d2137" stroke="#60a5fa" stroke-width="1.5" filter="url(#glow)"/>
  <text x="600" y="203" text-anchor="middle" fill="#93c5fd" font-size="15" font-weight="bold">generateObject()</text>
  <text x="600" y="220" text-anchor="middle" fill="#64748b" font-size="10">Vercel AI SDK — Structured output generation</text>

  <!-- Model -->
  <rect x="405" y="245" width="185" height="40" rx="8" fill="#0d1b3a" stroke="#3b82f6" stroke-width="1"/>
  <text x="410" y="260" fill="#64748b" font-size="9" font-weight="600">MODEL</text>
  <text x="497" y="275" text-anchor="middle" fill="#60a5fa" font-size="12" font-weight="600">Gemini 2.0 Flash</text>

  <!-- Schema -->
  <rect x="605" y="245" width="190" height="40" rx="8" fill="#0d1b3a" stroke="#3b82f6" stroke-width="1"/>
  <text x="610" y="260" fill="#64748b" font-size="9" font-weight="600">SCHEMA</text>
  <text x="700" y="275" text-anchor="middle" fill="#60a5fa" font-size="11" font-weight="600">InfrastructureRequestSchema</text>

  <!-- System Prompt -->
  <rect x="405" y="300" width="390" height="45" rx="8" fill="#0d1b3a" stroke="#3b82f6" stroke-width="1"/>
  <text x="410" y="315" fill="#64748b" font-size="9" font-weight="600">SYSTEM PROMPT</text>
  <text x="600" y="333" text-anchor="middle" fill="#93c5fd" font-size="12">INFRA_PARSER_SYSTEM_PROMPT</text>

  <!-- Retry config -->
  <rect x="405" y="360" width="185" height="45" rx="8" fill="#0d1b3a" stroke="#f59e0b" stroke-width="1"/>
  <text x="410" y="375" fill="#fbbf24" font-size="9" font-weight="600">RETRY CONFIG</text>
  <text x="497" y="393" text-anchor="middle" fill="#fbbf24" font-size="11">3 attempts, exp. backoff</text>

  <!-- Progress stream -->
  <rect x="605" y="360" width="190" height="45" rx="8" fill="#0d2137" stroke="#22d3ee" stroke-width="1"/>
  <text x="610" y="375" fill="#22d3ee" font-size="9" font-weight="600">STREAM</text>
  <text x="700" y="393" text-anchor="middle" fill="#22d3ee" font-size="11">progressStream.write()</text>

  <!-- Status updates inside stream box -->
  <rect x="405" y="420" width="390" height="45" rx="8" fill="#0d1b3a" stroke="#475569" stroke-width="0.5"/>
  <text x="410" y="435" fill="#64748b" font-size="9" font-weight="600">STREAM EVENTS</text>
  <text x="420" y="453" fill="#94a3b8" font-size="10">{ step: "parse", status: "running" } → { step: "parse", status: "complete", parsedRequest }</text>

  <!-- Arrow: AI Call -> Output -->
  <line x1="820" y1="320" x2="890" y2="320" stroke="url(#arrowGrad)" stroke-width="2.5" marker-end="url(#arrowHead)"/>

  <!-- ═══════════ OUTPUT ═══════════ -->
  <text x="910" y="145" fill="#94a3b8" font-size="12" font-weight="600" letter-spacing="2">OUTPUT</text>
  <rect x="900" y="160" width="260" height="320" rx="14" fill="url(#outputGrad)" stroke="#22c55e" stroke-width="2" filter="url(#softShadow)"/>

  <text x="1030" y="190" text-anchor="middle" fill="#4ade80" font-size="14" font-weight="bold">InfrastructureRequest</text>

  <rect x="920" y="205" width="220" height="30" rx="6" fill="#0d2a1a" stroke="#22c55e" stroke-width="0.5"/>
  <text x="930" y="224" fill="#86efac" font-size="11">provider:</text>
  <text x="1010" y="224" fill="#94a3b8" font-size="11">"aws" | "gcp" | "azure"</text>

  <rect x="920" y="245" width="220" height="30" rx="6" fill="#0d2a1a" stroke="#22c55e" stroke-width="0.5"/>
  <text x="930" y="264" fill="#86efac" font-size="11">projectName:</text>
  <text x="1025" y="264" fill="#94a3b8" font-size="11">string</text>

  <rect x="920" y="285" width="220" height="55" rx="6" fill="#0d2a1a" stroke="#22c55e" stroke-width="0.5"/>
  <text x="930" y="304" fill="#86efac" font-size="11">resources[]:</text>
  <text x="930" y="322" fill="#94a3b8" font-size="9">{ type, name, config }</text>
  <text x="930" y="334" fill="#64748b" font-size="9">e.g. "ec2_instance", "s3_bucket"</text>

  <rect x="920" y="350" width="220" height="30" rx="6" fill="#0d2a1a" stroke="#22c55e" stroke-width="0.5"/>
  <text x="930" y="369" fill="#86efac" font-size="11">region:</text>
  <text x="990" y="369" fill="#94a3b8" font-size="11">"eu-north-1"</text>

  <rect x="920" y="390" width="220" height="30" rx="6" fill="#0d2a1a" stroke="#22c55e" stroke-width="0.5"/>
  <text x="930" y="409" fill="#86efac" font-size="11">tags[]:</text>
  <text x="985" y="409" fill="#94a3b8" font-size="11">{ key, value }[]</text>

  <text x="1030" y="450" text-anchor="middle" fill="#64748b" font-size="10">Zod-validated typed object</text>
  <text x="1030" y="465" text-anchor="middle" fill="#64748b" font-size="10">passed to Step 2</text>

  <!-- ═══════════ STREAM FLOW ═══════════ -->
  <path d="M 700 405 C 700 520, 400 560, 200 560" stroke="url(#streamGrad)" stroke-width="2" fill="none" stroke-dasharray="6,4" class="animated-line" marker-end="url(#streamArrow)"/>
  <text x="420" y="545" fill="#22d3ee" font-size="10">real-time progress → frontend</text>

  <!-- Frontend indicator -->
  <rect x="50" y="540" width="160" height="40" rx="10" fill="#1e1e2e" stroke="#6366f1" stroke-width="1"/>
  <text x="130" y="565" text-anchor="middle" fill="#c4b5fd" font-size="11">ProgressTimeline.tsx</text>

  <!-- ═══════════ FLOW LABELS ═══════════ -->
  <rect x="50" y="620" width="300" height="60" rx="12" fill="#111" stroke="#333" stroke-width="1"/>
  <text x="70" y="642" fill="#e2e8f0" font-size="11" font-weight="600">File: src/trigger/parse-request.ts</text>
  <text x="70" y="662" fill="#94a3b8" font-size="10">Task ID: parseInfraRequest | maxDuration: 120s</text>

  <!-- Legend -->
  <rect x="900" y="520" width="260" height="80" rx="12" fill="#111" stroke="#333" stroke-width="1"/>
  <text x="920" y="542" fill="#e2e8f0" font-size="11" font-weight="600">Key Concepts</text>
  <text x="920" y="560" fill="#93c5fd" font-size="10">• generateObject() returns typed data</text>
  <text x="920" y="576" fill="#fbbf24" font-size="10">• Auto-retry on transient AI failures</text>
  <text x="920" y="592" fill="#22d3ee" font-size="10">• Progress streamed to UI in real-time</text>
</svg>
